<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page introuvable | Le Berceau des Ambitions</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbfaf7;color:#203247;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;text-align:center}
    main{max-width:520px}
    img{width:96px;height:96px;border-radius:50%;object-fit:contain;background:#fff}
    h1{color:#12345b;font-size:clamp(2rem,6vw,3rem);line-height:1.12;letter-spacing:-.03em;margin:20px 0 12px}
    p{color:#5a6a7b;margin:0 0 24px}
    a.btn{display:inline-block;padding:12px 22px;border-radius:999px;background:#12345b;color:#fff;font-weight:750;text-decoration:none}
    a.btn:hover{background:#087f91}
    a.btn:focus-visible{outline:3px solid #087f91;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-berceau.jpg" alt="Emblème du Berceau des Ambitions" width="96" height="96">
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n’existe pas ou a été déplacée.</p>
    <a class="btn" href="/">Retour à l’accueil</a>
  </main>
</body>
</html>
